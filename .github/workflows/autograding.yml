name: Autograding
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grade:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        run: sudo bash scripts/install-tools.sh
      - name: Build and grade
        run: make test
      - name: Publish grade summary
        if: always()
        run: |
          if [ -f build/grade.md ]; then
            cat build/grade.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Build/setup failed; inspect the job log. No score was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grading-results
          path: |
            build/grade.json
            build/grade.md
            build/logs/
          if-no-files-found: ignore
